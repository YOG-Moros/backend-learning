server:
  port: 8009

spring:
  application:
    name: 08-security
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:abc123}
      database: 11
      timeout: 3s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/backend_learning?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:abc123}
  # 每次启动都重跑 schema.sql / data.sql（先删后建，演示数据保持干净）
  sql:
    init:
      mode: always

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

# JWT 配置：HS256 密钥至少 32 字节，令牌有效期 120 分钟
jwt:
  secret: cch-08-security-demo-secret-key-2026-10-28-min-32-bytes!!
  expire-minutes: 120


mqxu:
  security:
    sms:
      store: ${SECURITY_SMS_STORE:memory}
      expose-code: true
      auto-register: true
      code-ttl: 5m
      send-interval: 60s
      max-fail-count: 5
