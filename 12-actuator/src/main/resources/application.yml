server:
  port: 8013

spring:
  application:
    name: 13-应用监控

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
    metrics:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    name: backend-learning
    module: 12-actuator
    version: 1.0.0
    description: 健康检查、指标采集与 Prometheus 对接示例

demo:
  inventory:
    healthy: true
    url: http://inventory-service/health
